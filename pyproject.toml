[project]
name = "complaint-routing"
version = "0.1.0"
description = "MLOps system for routing consumer-finance complaints to product queues (KSE MLOps course project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
