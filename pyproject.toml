[project]
name = "complaint-routing"
version = "0.3.0"
description = "MLOps system for routing consumer-finance complaints to product queues (KSE MLOps course project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.0.5",  # same as the Airflow 3.3.1 image: one pandas on both paths
    "pyarrow==25.0.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "mlflow==3.16.1",
    "dvc==3.67.1",
    "dvc-s3==3.3.0",
    "pyyaml>=6",
    # Lab 3: LLM baseline and retrieval
    "openai>=1.60",  # client for the OpenAI-compatible vLLM server
    "sentence-transformers>=3.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complaint_routing"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
