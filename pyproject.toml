[project]
name = "complaint-routing"
version = "0.4.0"
description = "MLOps system for routing consumer-finance complaints to product queues (KSE MLOps course project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.0.5",  # same as the Airflow 3.3.1 image: one pandas on both paths
    "pyarrow==25.0.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "mlflow==3.16.1",
    "pyyaml>=6",
    "psycopg[binary]>=3.2",
]

# Each container image installs the project plus only the groups it needs (Lab 4):
# router = serve, assistant = serve + llm, monitor = monitor. `make setup` installs them all.
[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
    "httpx",  # FastAPI test client
]
pipeline = [  # Lab 2: data versioning
    "dvc==3.67.1",
    "dvc-s3==3.3.0",
]
llm = [  # Lab 3: LLM baseline and retrieval
    "openai>=1.60",  # client for the OpenAI-compatible vLLM server
    "sentence-transformers>=3.3",
    "pgvector>=0.3",
    "beautifulsoup4>=4.12",
]
serve = [  # Lab 4: the two HTTP services
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.21",
]
monitor = [  # Lab 4: drift job, replay, retraining trigger
    "evidently==0.7.23",
    "prometheus-client>=0.21",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv]
default-groups = ["dev", "pipeline", "llm", "serve", "monitor"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complaint_routing"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
