# The scheduled drift job: reference window (in the champion's MLflow run) vs the current window
# (the prediction log, last DRIFT_WINDOW_MINUTES), Evidently, pushed to the Pushgateway.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-monitor
  namespace: complaint-routing
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels: {app: drift-monitor}
        spec:
          restartPolicy: Never
          containers:
            - name: drift
              image: complaint-routing/monitor:__IMAGE_TAG__
              imagePullPolicy: Never
              args: ["python", "-m", "complaint_routing.monitoring.drift"]
              envFrom:
                - configMapRef: {name: routing-config}
              env:
                - name: WAREHOUSE_DSN
                  valueFrom: {secretKeyRef: {name: complaint-routing-secrets, key: WAREHOUSE_DSN}}
              resources:
                requests: {cpu: 200m, memory: 400Mi}
                limits: {memory: 1500Mi}
