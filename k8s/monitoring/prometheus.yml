global:
  scrape_interval: 15s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: router          # the ML service, /metrics
    static_configs: [{targets: [router:80]}]
  - job_name: assistant       # the LLM service, /metrics
    static_configs: [{targets: [assistant:80]}]
  - job_name: pushgateway     # the drift job runs and exits, so it pushes instead
    honor_labels: true
    static_configs: [{targets: [pushgateway:9091]}]
  - job_name: alertmanager
    static_configs: [{targets: [alertmanager:9093]}]
  - job_name: prometheus
    static_configs: [{targets: [localhost:9090]}]
