# Prometheus (scrapes both services and the Pushgateway, evaluates the alert rules),
# Pushgateway (receives the drift job's numbers), Alertmanager (routes alerts to e-mail),
# Grafana (dashboard "Complaint routing"). Configuration comes from k8s/monitoring/ through
# ConfigMaps and, for Alertmanager (SMTP password), a Secret; scripts/k8s-up.sh creates them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: complaint-routing
  labels: {app: prometheus}
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
      annotations: {config-hash: __PROMETHEUS_CONFIG_HASH__}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports: [{containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: 9090}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /-/healthy, port: 9090}, periodSeconds: 20}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
          resources:
            requests: {cpu: 100m, memory: 150Mi}
            limits: {memory: 600Mi}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: complaint-routing}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: complaint-routing
  labels: {app: pushgateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pushgateway}
  template:
    metadata:
      labels: {app: pushgateway}
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.1
          ports: [{containerPort: 9091}]
          readinessProbe: {httpGet: {path: /-/ready, port: 9091}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /-/healthy, port: 9091}, periodSeconds: 20}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: pushgateway, namespace: complaint-routing}
spec:
  selector: {app: pushgateway}
  ports: [{port: 9091, targetPort: 9091}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: complaint-routing
  labels: {app: alertmanager}
spec:
  replicas: 1
  selector:
    matchLabels: {app: alertmanager}
  template:
    metadata:
      labels: {app: alertmanager}
      annotations: {config-hash: __ALERTMANAGER_CONFIG_HASH__}
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports: [{containerPort: 9093}]
          readinessProbe: {httpGet: {path: /-/ready, port: 9093}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /-/healthy, port: 9093}, periodSeconds: 20}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager}
            - {name: data, mountPath: /alertmanager}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: config
          secret: {secretName: alertmanager-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: alertmanager, namespace: complaint-routing}
spec:
  selector: {app: alertmanager}
  ports: [{port: 9093, targetPort: 9093}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: complaint-routing
  labels: {app: grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
      annotations: {config-hash: __GRAFANA_CONFIG_HASH__}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          env:
            # Local only (reached through kubectl port-forward on 127.0.0.1): no login screen.
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/complaint-routing.json}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
          ports: [{containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}, initialDelaySeconds: 30, periodSeconds: 20}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboards-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 400Mi}
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
            items: [{key: datasources.yml, path: datasources.yml}]
        - name: dashboards-provider
          configMap:
            name: grafana-provisioning
            items: [{key: dashboards.yml, path: dashboards.yml}]
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: complaint-routing}
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
